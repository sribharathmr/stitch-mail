<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C67C7"/>
    </linearGradient>
    <linearGradient id="stitch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0d7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Envelope body -->
  <rect x="10" y="18" width="44" height="30" rx="4" fill="none" stroke="url(#stitch)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Envelope flap (V shape) -->
  <path d="M10 22 L32 38 L54 22" fill="none" stroke="url(#stitch)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
